<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buat Password Baru - Aminmart Cashier</title>
    <meta name="robots" content="noindex">
    <link rel="icon" type="image/png" href="cashier-icon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'media',
            theme: { extend: { colors: { brand: { 50: '#fff1f2', 100: '#ffe4e6', 500: '#f43f5e', 600: '#e11d48' } } } }
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
    </style>
</head>

<body class="bg-brand-50 text-slate-900 dark:bg-black dark:text-slate-100 min-h-screen flex items-center justify-center px-4 text-lg">
    <main class="bg-white/80 dark:bg-slate-900/80 rounded-3xl p-8 max-w-md w-full border border-brand-100 dark:border-brand-900 shadow-lg">
        <img src="cashier-icon.png" alt="Logo Aminmart" class="w-20 h-20 mx-auto mb-4 rounded-2xl">

        <form id="form" class="hidden space-y-4">
            <h1 class="text-2xl font-extrabold text-center">Buat Password Baru</h1>
            <label class="block">
                <span class="font-semibold">Password baru</span>
                <input id="password" type="password" minlength="6" required autocomplete="new-password"
                    class="mt-1 w-full rounded-xl border border-slate-300 dark:border-slate-700 bg-transparent px-4 py-3">
                <span class="text-base text-slate-500">Minimal 6 karakter</span>
            </label>
            <label class="block">
                <span class="font-semibold">Ulangi password</span>
                <input id="confirm" type="password" minlength="6" required autocomplete="new-password"
                    class="mt-1 w-full rounded-xl border border-slate-300 dark:border-slate-700 bg-transparent px-4 py-3">
            </label>
            <label class="flex items-center gap-2">
                <input id="show" type="checkbox" class="w-5 h-5"> Tampilkan password
            </label>
            <p id="error" class="text-red-600 font-semibold"></p>
            <button id="submit" type="submit"
                class="w-full bg-brand-600 text-white py-4 rounded-xl font-bold hover:bg-brand-500 transition disabled:opacity-50">
                Simpan Password
            </button>
        </form>

        <div id="message" class="text-center">
            <p class="text-slate-600 dark:text-slate-400">Memeriksa link…</p>
        </div>
    </main>

    <script>
        const SUPABASE_URL = 'https://rjsjllbkpikyjfzjtaxz.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable__NzycD_5cw6sMtfpgQCuqA_QU2DOZab';
        const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const form = document.getElementById('form');
        const message = document.getElementById('message');
        const error = document.getElementById('error');
        const password = document.getElementById('password');
        const confirm = document.getElementById('confirm');

        function showMessage(title, body) {
            form.classList.add('hidden');
            message.classList.remove('hidden');
            message.innerHTML = '';
            const h = document.createElement('h1');
            h.className = 'text-2xl font-extrabold mb-3';
            h.textContent = title;
            const p = document.createElement('p');
            p.className = 'text-slate-600 dark:text-slate-400';
            p.textContent = body;
            message.append(h, p);
        }

        // Link error dari Supabase (kedaluwarsa / sudah dipakai) datang lewat hash
        const hash = new URLSearchParams(location.hash.slice(1));
        if (hash.has('error')) {
            showMessage('Link tidak valid', 'Link mungkin sudah kedaluwarsa atau pernah dipakai. Tekan "Lupa Password?" lagi di aplikasi untuk mendapatkan link baru.');
        } else {
            client.auth.getSession().then(({ data }) => {
                if (location.hash) history.replaceState(null, '', location.pathname);
                if (data.session) {
                    message.classList.add('hidden');
                    form.classList.remove('hidden');
                } else {
                    showMessage('Link tidak valid', 'Buka halaman ini dari link di email reset password. Tekan "Lupa Password?" di aplikasi untuk mendapatkan link baru.');
                }
            });
        }

        document.getElementById('show').addEventListener('change', (e) => {
            password.type = confirm.type = e.target.checked ? 'text' : 'password';
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            error.textContent = '';
            if (password.value !== confirm.value) {
                error.textContent = 'Password tidak sama.';
                return;
            }
            const button = document.getElementById('submit');
            button.disabled = true;
            const { error: err } = await client.auth.updateUser({ password: password.value });
            button.disabled = false;
            if (err) {
                error.textContent = err.message.includes('different from the old')
                    ? 'Password baru harus berbeda dari password lama.'
                    : 'Gagal menyimpan password. Coba lagi.';
                return;
            }
            await client.auth.signOut();
            showMessage('Password berhasil diganti ✓', 'Silakan kembali ke aplikasi Aminmart Kasir dan masuk dengan password baru.');
        });
    </script>
</body>

</html>
